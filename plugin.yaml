name: agent-peers
version: "0.1.1"
description: "Discover and message local Claude Code and Codex sessions with private conversation reply inboxes."
manifest_version: 1
license: MIT
homepage: https://github.com/ThomasMarcelis/agent-peers
tags: [agents, coordination, local]
provides_tools:
  - list_peers
  - send_peer
# Optional host extension: registered only when both conversation APIs exist.
# Automatic replies require session_message_route + inject_session_message and
# the explicit plugins.entries.agent-peers.allow_gateway_injection grant.
# Hermes does not currently define a declarable capability for this grant.
provides_hooks:
  - on_session_message_route_closed
config_schema:
  bridge_command:
    type: list
    description: "Optional executable/argument list overriding the bundled Node bridge."
