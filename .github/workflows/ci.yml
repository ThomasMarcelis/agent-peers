name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - run: npm audit --omit=dev --audit-level=high
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: python -m pip install 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2'
      - run: python -m pytest -q
  hermes:
    name: Hermes pinned host
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HERMES_TEST_REF: 1afb5d16d2d25e1d8e13703c1ce946e3ca0adc0d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - name: Checkout the documented Hermes host
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ThomasMarcelis/hermes-agent
          ref: ${{ env.HERMES_TEST_REF }}
          path: .hermes-test-host
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Prepare isolated host test environment
        run: |
          uv venv .hermes-test-host/.venv --python 3.11
          uv pip install --python .hermes-test-host/.venv/bin/python -e '.hermes-test-host[dev,messaging]'
      - name: Test real host discovery and conversation routing
        run: .hermes-test-host/scripts/run_tests.sh "$GITHUB_WORKSPACE/test/test_hermes_host.py" -m hermes_integration -q
