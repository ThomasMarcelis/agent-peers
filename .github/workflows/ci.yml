name: CI
# Kept small on purpose: five jobs per run. Pull requests run CI; pushes run only on main,
# because the release workflow requires a successful run for the exact tagged commit.
# Docs-only changes skip CI; run it manually with `gh workflow run ci.yml --ref <branch-or-tag>`.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            audit: true
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - if: matrix.audit
        run: npm audit --omit=dev --audit-level=high
  python:
    name: Python 3.11 and 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.11
            3.13
      - run: npm ci --ignore-scripts
      - name: Test the oldest and newest supported Python
        run: |
          for python in python3.11 python3.13; do
            echo "::group::$python"
            "$python" -m pip install 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2'
            "$python" -m pytest -q
            echo "::endgroup::"
          done
  hermes:
    name: Hermes pinned host
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HERMES_TEST_REF: 0d7c749cff42cd4791e0342da226c6d499de5aeb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts
      - name: Checkout the documented Hermes host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ThomasMarcelis/hermes-agent
          ref: ${{ env.HERMES_TEST_REF }}
          path: .hermes-test-host
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Prepare isolated host test environment
        run: |
          uv venv .hermes-test-host/.venv --python 3.14
          cd .hermes-test-host && uv pip install --python .venv/bin/python -e '.[messaging]' --group dev --group test pyyaml
      - name: Test real host discovery and conversation routing
        env:
          HERMES_PYTHON: ${{ github.workspace }}/.hermes-test-host/.venv/bin/python
        run: .hermes-test-host/scripts/run_tests.sh "$GITHUB_WORKSPACE/test/test_hermes_host.py" -m hermes_integration -q
