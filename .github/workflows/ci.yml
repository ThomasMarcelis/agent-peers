name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - run: npm audit --omit=dev --audit-level=high
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: python -m pip install 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2'
      - run: python -m pytest -q
  hermes:
    name: Hermes pinned host
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HERMES_TEST_REF: 1afb5d16d2d25e1d8e13703c1ce946e3ca0adc0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - name: Checkout the documented Hermes host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ThomasMarcelis/hermes-agent
          ref: ${{ env.HERMES_TEST_REF }}
          path: .hermes-test-host
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Prepare isolated host test environment
        run: |
          uv venv .hermes-test-host/.venv --python 3.11
          uv pip install --python .hermes-test-host/.venv/bin/python -e '.hermes-test-host[dev,messaging]'
      - name: Test real host discovery and conversation routing
        run: .hermes-test-host/scripts/run_tests.sh "$GITHUB_WORKSPACE/test/test_hermes_host.py" -m hermes_integration -q
